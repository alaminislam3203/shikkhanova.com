<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Graduation Cap in Royal Navy Blue -->
  <g id="graduation-cap" fill="#003893">
    <polygon points="300,30 460,95 300,160 140,95" />
    <path d="M 210,130 Q 300,175 390,130 L 390,150 Q 300,195 210,150 Z" />
    <circle cx="300" cy="95" r="7" fill="#FF7300" />
    <path d="M 300,95 Q 365,100 375,145" stroke="#FF7300" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 368,145 L 382,145 L 388,185 L 362,185 Z" fill="#FF7300" />
    <circle cx="375" cy="145" r="5" fill="#FF7300" />
  </g>

  <!-- Open Book & Sun Rays -->
  <g id="book-and-person">
    <rect x="150" y="105" width="28" height="8" rx="4" transform="rotate(45 150 105)" fill="#FF7300" />
    <rect x="135" y="145" width="28" height="8" rx="4" transform="rotate(15 135 145)" fill="#FF7300" />

    <path d="M 300,165 Q 230,130 155,160 Q 235,115 300,165 Z" fill="#FF7300" />
    <path d="M 300,165 Q 370,130 445,160 Q 365,115 300,165 Z" fill="#FF7300" />

    <path d="M 300,185 Q 210,145 130,190 Q 220,130 300,185 Z" fill="#003893" />
    <path d="M 300,185 Q 390,145 470,190 Q 380,130 300,185 Z" fill="#003893" />

    <circle cx="300" cy="120" r="18" fill="#003893" />
    <path d="M 300,145 Q 275,170 250,190 Q 300,165 350,190 Q 325,170 300,145 Z" fill="#003893" />
  </g>

  <!-- Text: "Shikkha" in Bold Rounded Royal Navy Blue -->
  <g id="text-shikkha" fill="#003893">
    <path d="M 125,230 C 125,225 135,220 148,220 C 165,220 178,228 178,245 C 178,268 142,260 142,275 C 142,282 150,285 158,285 C 168,285 176,280 180,275 L 180,292 C 174,297 163,300 152,300 C 132,300 120,290 120,272 C 120,250 156,256 156,242 C 156,236 150,234 144,234 C 136,234 129,238 125,242 Z" />
    <path d="M 195,205 L 217,205 L 217,245 C 223,238 232,234 243,234 C 258,234 268,244 268,260 L 268,298 L 246,298 L 246,263 C 246,254 241,250 234,250 C 226,250 220,256 217,264 L 217,298 L 195,298 Z" />
    <circle cx="283" cy="220" r="10" />
    <rect x="273" y="236" width="20" height="62" rx="6" />
    <rect x="306" y="205" width="20" height="93" rx="6" />
    <path d="M 326,260 L 350,236 L 375,236 L 340,268 L 378,298 L 352,298 L 326,275 Z" />
    <rect x="385" y="205" width="20" height="93" rx="6" />
    <path d="M 405,260 L 429,236 L 454,236 L 419,268 L 457,298 L 431,298 L 405,275 Z" />
    <path d="M 466,205 L 488,205 L 488,245 C 494,238 503,234 514,234 C 529,234 539,244 539,260 L 539,298 L 517,298 L 517,263 C 517,254 512,250 505,250 C 497,250 491,256 488,264 L 488,298 L 466,298 Z" />
    <path d="M 578,236 L 578,298 L 558,298 L 558,288 C 552,295 543,300 532,300 C 516,300 504,289 504,272 C 504,254 518,244 538,244 C 546,244 553,246 558,249 L 558,246 C 558,238 552,234 542,234 C 533,234 525,238 521,242 L 521,228 C 528,223 538,220 548,220 C 568,220 578,230 578,246 Z M 558,268 C 553,264 547,262 541,262 C 532,262 526,266 526,273 C 526,280 532,284 540,284 C 548,284 554,279 558,272 Z" />
  </g>

  <!-- Text: "Nova" in Friendly Energy Orange -->
  <text x="445" y="200" font-family="'Hind Siliguri', 'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#FF7300">Nova</text>

  <!-- Underline Wings & Slogan "শিখবো, জিতবো" -->
  <g id="slogan-section">
    <path d="M 60,332 Q 130,330 185,332 L 60,336 Z" fill="#003893" />
    <text x="300" y="342" font-family="'Hind Siliguri', sans-serif" font-weight="800" font-size="34" fill="#E11D48" text-anchor="middle">শিখবো, জিতবো</text>
    <path d="M 540,332 Q 470,330 415,332 L 540,336 Z" fill="#003893" />
  </g>
</svg>

