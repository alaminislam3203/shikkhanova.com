<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1E3C" />
      <stop offset="55%" stop-color="#112E5B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#bg2)" />
  <circle cx="1650" cy="500" r="320" fill="#F59E0B" opacity="0.1" />
  <circle cx="250" cy="100" r="220" fill="#C8102E" opacity="0.15" />
  <rect x="0" y="624" width="1920" height="16" fill="#C8102E" />

  <g transform="translate(130, 115)">
    <rect x="0" y="0" width="360" height="48" rx="24" fill="#F59E0B" />
    <text x="180" y="31" text-anchor="middle" fill="#0A1E3C" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="800">
      প্রিমিয়াম পিডিএফ হ্যান্ডনোট ও সাজেশন
    </text>

    <text x="0" y="140" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="68" font-weight="800">
      ৫ম থেকে ১০ম শ্রেণির <tspan fill="#FBBF24">স্পেশাল শিট ও নোট</tspan>
    </text>

    <text x="0" y="210" fill="#E2E8F0" font-family="'Hind Siliguri', sans-serif" font-size="30" font-weight="600">
      NCTB সিলেবাস অনুযায়ী গণিত, বিজ্ঞান, ইংরেজি, পদার্থ, রসায়ন ও জীববিজ্ঞান হ্যান্ডনোট
    </text>

    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="340" height="58" rx="14" fill="#C8102E" />
      <text x="170" y="37" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700">
        ✓ বিকাশ ও নগদে তাৎক্ষণিক সংগ্রহ
      </text>

      <rect x="360" y="0" width="340" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" />
      <text x="530" y="37" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700">
        ✓ ১০০% কমন উপযোগী চূড়ান্ত সাজেশন
      </text>
    </g>

    <g transform="translate(0, 355)">
      <rect x="0" y="0" width="540" height="62" rx="16" fill="#061226" stroke="#FBBF24" stroke-width="2" />
      <text x="270" y="40" text-anchor="middle" fill="#FBBF24" font-family="'Hind Siliguri', sans-serif" font-size="25" font-weight="700">
        বিকাশ / নগদ পার্সোনাল নম্বর: ০১৭১২৫৯২৫১৯
      </text>
    </g>
  </g>

  <!-- Right Book / PDF Showcase Card -->
  <g transform="translate(1320, 115)">
    <rect x="0" y="0" width="470" height="410" rx="34" fill="#061226" fill-opacity="0.85" stroke="#FBBF24" stroke-width="2" />
    <rect x="45" y="45" width="380" height="90" rx="18" fill="#C8102E" />
    <text x="235" y="102" text-anchor="middle" fill="#FFFFFF" font-family="'Exo 2', 'Hind Siliguri', sans-serif" font-size="36" font-weight="800">
      NCTB &amp; Special PDF
    </text>
    <text x="235" y="205" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="30" font-weight="700">
      সৃজনশীল ও MCQ শর্টকাট টেকনিক
    </text>
    <text x="235" y="255" text-anchor="middle" fill="#94A3B8" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="600">
      অধ্যায়ভিত্তিক রঙিন লেকচার শিট
    </text>
    <rect x="75" y="295" width="320" height="64" rx="16" fill="#10B981" />
    <text x="235" y="336" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="25" font-weight="800">
      ফ্রি ও প্রিমিয়াম শিট ডাউনলোড
    </text>
  </g>
</svg>
