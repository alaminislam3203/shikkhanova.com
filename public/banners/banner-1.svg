<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061226" />
      <stop offset="52%" stop-color="#0A1E3C" />
      <stop offset="100%" stop-color="#3A0B1E" />
    </linearGradient>
    <linearGradient id="crimson1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0A1E3C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="640" fill="url(#bg1)" />
  <rect width="1920" height="640" fill="url(#glow1)" />

  <!-- Decorative Geometric Shapes -->
  <circle cx="1720" cy="120" r="280" fill="#C8102E" opacity="0.12" />
  <circle cx="180" cy="560" r="240" fill="#1E40AF" opacity="0.15" />
  <path d="M1320,0 L1920,0 L1920,640 L1140,640 Z" fill="#C8102E" opacity="0.1" />
  <rect x="0" y="624" width="1920" height="16" fill="url(#crimson1)" />

  <!-- Left Content Area -->
  <g transform="translate(130, 110)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="380" height="48" rx="24" fill="#C8102E" />
    <text x="190" y="31" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="22" font-weight="700">
      জুম্মাপাড়া, নীলফামারী সদর • "শিখবো, জিতবো"
    </text>

    <!-- Main Heading -->
    <text x="0" y="145" fill="#FFFFFF" font-family="'Hind Siliguri', 'Exo 2', sans-serif" font-size="78" font-weight="800">
      শিক্ষানোভা <tspan fill="#FF4D6D">SikkhaNova</tspan> একাডেমি
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#E2E8F0" font-family="'Hind Siliguri', sans-serif" font-size="32" font-weight="600">
      ৫ম থেকে ১০ম শ্রেণির আধুনিক ও ডিজিটাল একাডেমিক কোচিং এবং শিক্ষা ব্যবস্থাপনা
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 265)">
      <rect x="0" y="0" width="310" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" />
      <text x="155" y="37" text-anchor="middle" fill="#F8FAFC" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700">
        ✓ ৫ম - ১০ম শ্রেণি স্পেশাল ব্যাচ
      </text>

      <rect x="330" y="0" width="320" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" />
      <text x="490" y="37" text-anchor="middle" fill="#F8FAFC" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700">
        ✓ অধ্যায়ভিত্তিক রঙিন হ্যান্ডনোট
      </text>

      <rect x="670" y="0" width="330" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" />
      <text x="835" y="37" text-anchor="middle" fill="#F8FAFC" font-family="'Hind Siliguri', sans-serif" font-size="24" font-weight="700">
        ✓ সাপ্তাহিক ও মাসিক মডেল টেস্ট
      </text>
    </g>

    <!-- Helpline Bar -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="520" height="66" rx="16" fill="#FFFFFF" />
      <text x="260" y="43" text-anchor="middle" fill="#0A1E3C" font-family="'Hind Siliguri', sans-serif" font-size="28" font-weight="800">
        📞 ভর্তি ও হেল্পলাইন: <tspan fill="#C8102E">০১৭১২৫৯২৫১৯</tspan>
      </text>
    </g>
  </g>

  <!-- Right Emblem / Badge Card -->
  <g transform="translate(1330, 110)">
    <rect x="0" y="0" width="460" height="420" rx="36" fill="#FFFFFF" fill-opacity="0.96" />
    <rect x="20" y="20" width="420" height="380" rx="28" fill="none" stroke="#C8102E" stroke-width="3" stroke-dasharray="10,6" />
    <circle cx="230" cy="125" r="64" fill="#0A1E3C" />
    <text x="230" y="143" text-anchor="middle" fill="#FFFFFF" font-family="'Exo 2', sans-serif" font-size="52" font-weight="900">
      SN
    </text>
    <text x="230" y="235" text-anchor="middle" fill="#0A1E3C" font-family="'Hind Siliguri', sans-serif" font-size="38" font-weight="800">
      ভর্তি চলছে!
    </text>
    <text x="230" y="280" text-anchor="middle" fill="#C8102E" font-family="'Hind Siliguri', sans-serif" font-size="26" font-weight="700">
      শ্রেণি: ৫ম, ৬ষ্ঠ, ৭ম, ৮ম, ৯ম ও ১০ম
    </text>
    <rect x="65" y="310" width="330" height="54" rx="14" fill="#C8102E" />
    <text x="230" y="345" text-anchor="middle" fill="#FFFFFF" font-family="'Hind Siliguri', sans-serif" font-size="23" font-weight="700">
      বিজ্ঞান • মানবিক • ব্যবসায় শিক্ষা
    </text>
  </g>
</svg>
